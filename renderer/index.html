<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldogram Miner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080808; color: #fff; font-family: 'SF Mono', monospace; height: 100vh; overflow: hidden; user-select: none; -webkit-app-region: no-drag; }
.titlebar { height: 38px; -webkit-app-region: drag; display: flex; align-items: center; justify-content: center; background: #080808; border-bottom: 1px solid #111; }
.titlebar span { font-size: 12px; color: #444; letter-spacing: 0.15em; }
.container { padding: 20px; height: calc(100vh - 38px); display: flex; flex-direction: column; gap: 16px; }
.stats-row { display: flex; gap: 12px; }
.stat-card { flex: 1; background: #111; border: 1px solid #1a1a1a; border-radius: 12px; padding: 14px; text-align: center; }
.stat-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #444; margin-bottom: 6px; }
.stat-value { font-size: 20px; font-weight: 600; color: #D4AF37; line-height: 1; }
.stat-value.cyan { color: #60c8dc; }
.stat-value.green { color: #4ade80; }
.canvas-wrap { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 12px; overflow: hidden; position: relative; flex: 1; }
canvas { display: block; width: 100%; height: 100%; }
.canvas-status { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: 0.1em; color: #333; }
.settings { background: #111; border: 1px solid #1a1a1a; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #444; }
.field input, .field select { background: #080808; border: 1px solid #222; border-radius: 8px; color: #fff; font-family: 'SF Mono', monospace; font-size: 12px; padding: 8px 10px; outline: none; width: 100%; }
.field input:focus, .field select:focus { border-color: #D4AF37; }
.btn-start { background: linear-gradient(135deg, #D4AF37, #A67C00); color: #000; border: none; border-radius: 10px; padding: 10px 24px; font-family: 'SF Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-stop { background: #1a1a1a; color: #ff4444; border: 1px solid #ff4444; border-radius: 10px; padding: 10px 24px; font-family: 'SF Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.log { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; padding: 10px; height: 80px; overflow-y: auto; font-size: 10px; color: #333; }
.log .accepted { color: #4ade80; }
.log .rejected { color: #ff4444; }
.log .info { color: #444; }
.log .synced { color: #D4AF37; }
.log .new_block { color: #60c8dc; }
</style>
</head>
<body>
<div class="titlebar"><span>⬡ GOLDOGRAM MINER</span></div>
<div class="container">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Hashrate</div><div class="stat-value" id="hashrate">0 H/s</div></div>
    <div class="stat-card"><div class="stat-label">Blocks Found</div><div class="stat-value cyan" id="blocks">0</div></div>
    <div class="stat-card"><div class="stat-label">Chain Height</div><div class="stat-value" id="height">—</div></div>
    <div class="stat-card"><div class="stat-label">Status</div><div class="stat-value green" id="status-text">IDLE</div></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="qc"></canvas>
    <div class="canvas-status" id="canvas-status">QUANTUM FIELD IDLE</div>
  </div>
  <div class="settings">
    <div class="field" style="flex:2">
      <label>Wallet Address</label>
      <input id="address" type="text" placeholder="GoXXX..." spellcheck="false">
    </div>
    <div class="field">
      <label>Cores</label>
      <input id="cores" type="number" value="4" min="1" max="64">
    </div>
    <div class="field">
      <label>Mode</label>
      <select id="mode"><option value="solo">⚡ Solo</option><option value="pool">🏊 Pool</option></select>
    </div>
    <button class="btn-start" id="btn-start" onclick="startMining()">▶ Start</button>
    <button class="btn-stop" id="btn-stop" onclick="stopMining()" style="display:none">■ Stop</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
const canvas = document.getElementById('qc');
const ctx = canvas.getContext('2d');
let isMining = false;
let animId;
let t = 0;
let blocksFound = 0;
let foundFlash = 0;

function resize() {
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', resize);

const CORES = 12;
const rings = Array.from({length: 4}, (_, i) => ({
  radius: 30 + i * 22, angle: Math.random() * Math.PI * 2,
  speed: (i % 2 === 0 ? 1 : -1) * (0.006 + i * 0.003),
  nodes: 3 + i, phase: Math.random() * Math.PI * 2,
}));

const CHARS = '01Ψ∇⊗⟨⟩ℏΩ∑Φ√±∞';
let columns = [];
function initCols(w) {
  columns = [];
  for (let i = 0; i < Math.floor(w / 14); i++) {
    columns.push({ x: i * 14 + 7, y: Math.random() * 200, speed: 0.3 + Math.random() * 0.6,
      char: CHARS[Math.floor(Math.random() * CHARS.length)], alpha: 0.03 + Math.random() * 0.05, timer: Math.random() * 30 });
  }
}
initCols(canvas.offsetWidth);

const streams = Array.from({length: CORES}, (_, i) => ({
  phase: (i / CORES) * Math.PI * 2, speed: 0.025 + Math.random() * 0.02,
  hz: 0, amp: 6 + Math.random() * 5, color: i % 3 === 0 ? 'cyan' : 'gold',
}));

function gold(a) { return `rgba(212,175,55,${a})`; }
function cyan(a) { return `rgba(96,200,220,${a})`; }
function purple(a) { return `rgba(160,100,255,${a})`; }

function draw() {
  t++;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  const cx = w / 2, cy = h / 2;
  ctx.clearRect(0, 0, w, h);

  const active = isMining;

  // Hash rain
  columns.forEach(col => {
    col.y += active ? col.speed : col.speed * 0.1;
    col.timer--;
    if (col.timer <= 0) { col.char = CHARS[Math.floor(Math.random() * CHARS.length)]; col.timer = 15 + Math.random() * 30; }
    if (col.y > h) col.y = -10;
    ctx.fillStyle = foundFlash > 0 ? cyan(col.alpha * 2) : gold(col.alpha * (active ? 1 : 0.3));
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(col.char, col.x, col.y);
  });

  // Streams
  streams.forEach((s, i) => {
    s.phase += active ? s.speed : s.speed * 0.05;
    const side = i < CORES / 2 ? 0 : 1;
    const li = side === 0 ? i : i - Math.floor(CORES / 2);
    const tot = Math.ceil(CORES / 2);
    const yPos = 20 + (li / (tot - 1 || 1)) * (h - 40);
    const xS = side === 0 ? 0 : cx + 50, xE = side === 0 ? cx - 50 : w;
    const intensity = active ? 0.6 + Math.sin(s.phase) * 0.3 : 0.1;
    ctx.beginPath();
    for (let k = 0; k <= 30; k++) {
      const x = xS + (xE - xS) * (k / 30);
      const y = yPos + Math.sin(s.phase + k * 0.4) * s.amp * intensity;
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = (s.color === 'cyan' ? cyan : gold)(0.2 + intensity * 0.15);
    ctx.lineWidth = 1;
    ctx.stroke();
    const dotX = side === 0 ? 5 : w - 5;
    const dp = 0.5 + 0.5 * Math.sin(s.phase * 2);
    ctx.beginPath();
    ctx.arc(dotX, yPos, 2.5 * dp, 0, Math.PI * 2);
    ctx.fillStyle = s.color === 'cyan' ? cyan(0.7) : gold(0.7);
    ctx.fill();
  });

  // Rings
  rings.forEach((ring, ri) => {
    ring.angle += active ? ring.speed : ring.speed * 0.05;
    ring.phase += 0.015;
    const pulse = 0.6 + 0.4 * Math.sin(ring.phase);
    const alpha = (foundFlash > 0 ? 0.4 : (0.1 + ri * 0.03) * pulse) * (active ? 1 : 0.3);
    ctx.beginPath();
    ctx.arc(cx, cy, ring.radius, 0, Math.PI * 2);
    ctx.strokeStyle = foundFlash > 0 ? cyan(alpha) : gold(alpha);
    ctx.lineWidth = active ? 1 : 0.5;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
    for (let n = 0; n < ring.nodes; n++) {
      const a = ring.angle + (n / ring.nodes) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + ring.radius * Math.cos(a), cy + ring.radius * Math.sin(a), 2.5, 0, Math.PI * 2);
      ctx.fillStyle = foundFlash > 0 ? cyan(0.9) : (ri % 2 === 0 ? gold(0.8) : purple(0.7));
      ctx.fill();
    }
  });

  // Core
  const cp = 0.5 + 0.5 * Math.sin(t * (active ? 0.05 : 0.01));
  const cr = 18 + cp * 3;
  ctx.beginPath();
  ctx.arc(cx, cy, cr + 12, 0, Math.PI * 2);
  ctx.strokeStyle = foundFlash > 0 ? cyan(0.1) : gold(0.06 * (active ? 1 : 0.3));
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, Math.PI * 2);
  ctx.fillStyle = foundFlash > 0 ? 'rgba(96,200,220,0.15)' : 'rgba(212,175,55,0.08)';
  ctx.fill();
  ctx.strokeStyle = foundFlash > 0 ? cyan(0.9) : gold(active ? 0.8 : 0.3);
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = foundFlash > 0 ? cyan(1) : gold(active ? 0.9 : 0.3);
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(foundFlash > 0 ? 'FOUND' : 'GoGX', cx, cy - 2);
  ctx.font = '7px monospace';
  ctx.fillStyle = foundFlash > 0 ? cyan(0.7) : gold(active ? 0.5 : 0.2);
  ctx.fillText('PoW', cx, cy + 8);

  if (foundFlash > 0) foundFlash--;
  animId = requestAnimationFrame(draw);
}
draw();

function fmtHashrate(hr) {
  if (hr >= 1e6) return (hr / 1e6).toFixed(2) + ' MH/s';
  if (hr >= 1e3) return (hr / 1e3).toFixed(1) + ' KH/s';
  return hr.toFixed(0) + ' H/s';
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls || 'info';
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 100) el.removeChild(el.firstChild);
}

async function startMining() {
  const address = document.getElementById('address').value.trim();
  if (!address.startsWith('Go')) { log('⚠ Invalid wallet address — must start with Go', 'rejected'); return; }
  const cores = parseInt(document.getElementById('cores').value) || 4;
  const mode = document.getElementById('mode').value;
  const result = await window.miner.start({ address, cores, mode });
  if (result.error) { log('Error: ' + result.error, 'rejected'); return; }
  isMining = true;
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('status-text').textContent = 'MINING';
  document.getElementById('status-text').style.color = '#4ade80';
  document.getElementById('canvas-status').textContent = 'MINING ACTIVE — QUANTUM FIELD SYNCHRONIZED';
  log('▶ Mining started — ' + cores + ' cores — ' + mode + ' mode', 'synced');
}

async function stopMining() {
  await window.miner.stop();
  isMining = false;
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('status-text').textContent = 'IDLE';
  document.getElementById('status-text').style.color = '#4ade80';
  document.getElementById('canvas-status').textContent = 'QUANTUM FIELD IDLE';
  document.getElementById('hashrate').textContent = '0 H/s';
  log('■ Mining stopped', 'info');
}

window.miner.onMessage((msg) => {
  switch (msg.type) {
    case 'hashrate':
      document.getElementById('hashrate').textContent = fmtHashrate(msg.hashrate);
      document.getElementById('blocks').textContent = msg.blocks_found;
      blocksFound = msg.blocks_found;
      break;
    case 'synced':
      document.getElementById('height').textContent = msg.height.toLocaleString();
      log('✓ Synced — height ' + msg.height + ' — difficulty ' + msg.difficulty, 'synced');
      break;
    case 'new_block':
      document.getElementById('height').textContent = msg.height.toLocaleString();
      break;
    case 'block_accepted':
      foundFlash = 120;
      log('⚡ Block accepted! Height ' + msg.height + ' — Reward: ' + msg.reward.toFixed(3) + ' GoGX', 'accepted');
      break;
    case 'block_rejected':
      log('✗ ' + msg.message, 'rejected');
      break;
    case 'stopped':
      isMining = false;
      document.getElementById('btn-start').style.display = '';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('status-text').textContent = 'IDLE';
      document.getElementById('canvas-status').textContent = 'QUANTUM FIELD IDLE';
      break;
    case 'info':
      log(msg.message, 'info');
      break;
  }
});

// Load saved address
window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem('gm_address');
  if (saved) document.getElementById('address').value = saved;
  const cores = await window.miner.getCores();
  document.getElementById('cores').value = Math.max(1, cores - 2);
  document.getElementById('address').addEventListener('change', (e) => {
    localStorage.setItem('gm_address', e.target.value);
  });
});
</script>
</body>
</html>
